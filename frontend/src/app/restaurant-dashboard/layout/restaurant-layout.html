<section class="container py-4 py-lg-5">
  <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4">
    <div>
      <span class="badge-soft mb-2"><i class="bi bi-shop"></i> Espace restaurateur</span>
      <h1 class="section-title mb-1">Bonjour {{ auth.user()?.prenom }} 👋</h1>
      <p class="section-subtitle mb-0">Gérez votre activité, votre carte et les commandes reçues.</p>
    </div>
  </div>

  <div class="dash-shell">
    <aside class="card-soft dash-sidebar">
      <nav class="dash-nav">
        <a routerLink="/restaurant/dashboard" routerLinkActive="active">
          <i class="bi bi-speedometer2"></i> Tableau de bord
        </a>
        <a routerLink="/restaurant/orders" routerLinkActive="active">
          <i class="bi bi-receipt"></i> Commandes
        </a>
        <a routerLink="/restaurant/dishes" routerLinkActive="active">
          <i class="bi bi-egg-fried"></i> Menu & plats
        </a>
        <div class="divider"></div>
        <a routerLink="/"><i class="bi bi-house"></i> Retour au site</a>
        <button type="button" class="dash-logout" (click)="auth.logout()">
          <i class="bi bi-box-arrow-right"></i> Se déconnecter
        </button>
      </nav>
    </aside>

    <div>
      <router-outlet />
    </div>
  </div>
</section>
